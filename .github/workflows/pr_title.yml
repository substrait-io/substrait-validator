name: PR Title Check

on:
  # synchronize is required even though a push changes neither the title nor the
  # description: GitHub keys check runs to the head commit, so without it a push
  # strands the check on the previous commit.
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

# Serialize runs for the same PR so the comment job can't race with itself, but
# never cancel in progress: a dependabot rebase force-pushes and edits the PR
# body at once, firing synchronize and edited on the same commit. Cancelling one
# leaves a cancelled check-run on the head commit that fails the status rollup.
# Letting both finish yields two harmless successes instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

# Default to the minimum read-only token for all jobs.
permissions:
  contents: read

jobs:
  commitlint:
    name: PR title / description conforms to semantic-release
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.commitlint.outcome }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # pull_request_target checks out the base ref, not the PR head, so the
      # committed commitlint.config.js cannot be weakened by the PR being
      # validated.
      - uses: actions/checkout@v7
        with:
          # Do not leave the workflow token in .git/config: npm ci runs
          # third-party package code in this same workspace.
          persist-credentials: false
          sparse-checkout: |
            commitlint.config.js
            package.json
            package-lock.json
            .npmrc
          sparse-checkout-cone-mode: false
      # npm ci installs exactly the tree recorded in package-lock.json, so
      # neither a new commitlint release nor a compromised transitive dependency
      # can change what runs here. --ignore-scripts also blocks install hooks.
      - run: npm ci --ignore-scripts
      - id: commitlint
        continue-on-error: true
        # --no-install so this can only run the pinned local CLI, never fetch one.
        run: npx --no-install commitlint --verbose <<< "$COMMIT_MSG"
        env:
          COMMIT_MSG: >
            ${{ github.event.pull_request.title }}

            ${{ github.event.pull_request.body }}

  comment:
    name: Post / remove PR comment
    runs-on: ubuntu-latest
    needs: commitlint
    permissions:
      pull-requests: write
    steps:
      # The message below is prose inside the github-script template literal;
      # wrapping it would change the rendered comment, so disable line-length here.
      # yamllint disable rule:line-length
      - uses: actions/github-script@v9
        with:
          script: |
            // Hidden marker used to find this job's comment regardless of wording.
            const marker = "<!-- pr-title-check -->";
            const message = `${marker}
            **ACTION NEEDED**

            Substrait follows the [Conventional Commits specification](https://www.conventionalcommits.org/en/v1.0.0/) for release automation.

            The PR title and description are used as the merge commit message. Please update your PR title and description to match the specification.`;
            const passed = "${{ needs.commitlint.outputs.outcome }}" === "success";

            // Find an existing comment from this job, if any.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (passed) {
              // Clean up the comment now that the check passes.
              if (existing) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                });
              }
              return;
            }

            // Check failed: post the comment if it isn't already there, then fail the job.
            if (!existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message,
              });
            }
            core.setFailed(
              "PR title and description do not follow the Conventional Commits specification."
            );
      # yamllint enable rule:line-length
