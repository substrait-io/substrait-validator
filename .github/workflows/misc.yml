name: Misc

on:
  pull_request:

jobs:
  license:
    name: Check license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check License Header
        uses: enarx/spdx@8dd1a10623686920a56406bbacb795c61fa23343
        with:
          licenses: |-
            Apache-2.0
            MIT

  editorconfig:
    name: Check editorconfig
    runs-on: ubuntu-latest
    steps:
      - uses: editorconfig-checker/action-editorconfig-checker@v2

  check-version-patch:
    name: Check version update patch file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version update patch file
        run: python3 ci/version.py check

  # The PR title check runs on pull_request_target and so always uses main's
  # toolchain and config. This job exercises the PR's own copies, so a change
  # that breaks them (e.g. a dependabot npm bump) fails here before it merges.
  # It never comments or decides the title check.
  commitlint-toolchain:
    name: Commitlint toolchain smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - name: Good messages pass, a bad one fails as a lint error
        run: |
          for msg in 'feat: ok' 'feat(x)!: drop y'; do
            echo "$msg" | npx --no-install commitlint --strict
          done
          status=0
          echo 'wip: x' | npx --no-install commitlint --strict || status=$?
          if [ "$status" -ne 3 ]; then
            echo "expected 'wip: x' to fail with exit 3, got $status" >&2
            exit 1
          fi
