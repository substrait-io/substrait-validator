version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      strum:
        applies-to: version-updates
        patterns:
          - "strum*"
      prost:
        applies-to: version-updates
        patterns:
          - "prost*"
      substrait:
        applies-to: version-updates
        patterns:
          - "substrait*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  # Keeps the pinned commitlint toolchain in package.json / package-lock.json
  # current; it is only used to lint PR titles and commit messages.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      commitlint:
        patterns:
          - "@commitlint/*"

  - package-ecosystem: "pip"
    directory: "/py"
    schedule:
      interval: "daily"
    groups:
      substrait:
        applies-to: version-updates
        patterns:
          - "substrait*"
