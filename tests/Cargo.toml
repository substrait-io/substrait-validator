[package]
name = "test-runner"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "runner"

[[bin]]
name = "runner"
path = "src/runner.rs"

[features]
# Build and vendor protoc from source. See also rs/Cargo.toml. Nothing in this
# crate needs protoc itself; the feature exists to forward the request to the
# validator, whose build script compiles protobuf files.
protoc = ["substrait-validator/protoc"]

[dependencies]
substrait-validator = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"
glob = "0.3"
rayon = "1.12"
