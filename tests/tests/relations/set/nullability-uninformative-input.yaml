---
name: set-nullability-uninformative-input
plan:
  __test: [ level: w ]
  version: { producer: validator-test }
  relations:
  # An input whose schema the validator cannot derive says nothing about nulls.
  # Counting it as nullable would publish a field no input declares nullable,
  # and every consumer downstream would then disagree with the plan.
  - rel:
      set:
        inputs:
        - read:
            namedTable: { names: [primary] }
            baseSchema:
              names: [a]
              struct:
                nullability: NULLABILITY_REQUIRED
                types:
                - i32: { nullability: NULLABILITY_REQUIRED }
        - extensionLeaf:
            detail:
              '@type': substrait.Plan
            __test: [ type: "!" ]
        op: SET_OP_UNION_ALL
        __test: [ type: "STRUCT<i32>" ]
  # The same in the primary position: with no nullability to start from, the
  # field stays nullable rather than being declared free of nulls.
  - rel:
      set:
        inputs:
        - extensionLeaf:
            detail:
              '@type': substrait.Plan
            __test: [ type: "!" ]
        - read:
            namedTable: { names: [secondary] }
            baseSchema:
              names: [a]
              struct:
                nullability: NULLABILITY_REQUIRED
                types:
                - i32: { nullability: NULLABILITY_NULLABLE }
        op: SET_OP_MINUS_PRIMARY
        __test: [ type: "STRUCT<i32?>" ]
  # An uninformative primary with required secondaries: the field stays required,
  # because no input declares it nullable.
  - rel:
      set:
        inputs:
        - extensionLeaf:
            detail:
              '@type': substrait.Plan
            __test: [ type: "!" ]
        - read:
            namedTable: { names: [secondary] }
            baseSchema:
              names: [a]
              struct:
                nullability: NULLABILITY_REQUIRED
                types:
                - i32: { nullability: NULLABILITY_REQUIRED }
        op: SET_OP_UNION_ALL
        __test: [ type: "STRUCT<i32>" ]
  expectedTypeUrls:
  - substrait.Plan
